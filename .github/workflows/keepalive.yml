name: keepalive

# Pings the Render health endpoint so the free instance does not sleep
# after 15 minutes of inactivity. Repo is public -> Actions minutes are free.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          curl -fsS -m 90 https://line-expense-bot-xrvi.onrender.com/healthz
          echo "pinged OK"
